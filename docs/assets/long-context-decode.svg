<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d">
  <title id="t">Decode speed at 100k tokens of context, with and without two shura.cpp parts</title>
  <desc id="d">Bar chart. 200k profile without MTP: 39.2 tokens per second without the GQA attention kernel, 56.1 with it. 262k profile with MTP: 41 to 43 tokens per second without the MTP draft window, 57 to 58 with it. RX 7800 XT 16 GB, ROCm 10.1, a 35B MoE model.</desc>
  <style>
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .base { fill: #7a8699; }
    .ours { fill: #0e9384; }
    .axis { stroke: #59636e; stroke-width: 1; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .base { fill: #8b96a8; }
      .ours { fill: #2dd4bf; }
      .axis { stroke: #9198a1; }
    }
  </style>
  <text x="40" y="30" class="ink sans" font-size="17" font-weight="600">Decode at 100k tokens of context, tokens per second</text>
  <g transform="translate(40 46)">
    <rect class="base" x="0" y="0" width="14" height="14" rx="3"/>
    <text x="22" y="12" class="muted sans" font-size="14">llama.cpp 1.0 code path (the part switched off)</text>
    <rect class="ours" x="360" y="0" width="14" height="14" rx="3"/>
    <text x="382" y="12" class="muted sans" font-size="14">shura.cpp 1.0</text>
  </g>
  <!-- 1 tok/s = 9 px, bars start at x = 300 -->
  <line class="axis" x1="300" y1="84" x2="300" y2="248"/>
  <text x="288" y="112" text-anchor="end" class="ink sans" font-size="15" font-weight="600">200k profile, no MTP</text>
  <text x="288" y="131" text-anchor="end" class="muted sans" font-size="13">GQA decode attention kernel</text>
  <path class="base" d="M300 92 h349 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-349 z"/>
  <text x="661" y="110" class="ink sans" font-size="14">39.2</text>
  <path class="ours" d="M300 120 h501 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-501 z"/>
  <text x="813" y="138" class="ink sans" font-size="14" font-weight="600">56.1</text>
  <text x="288" y="192" text-anchor="end" class="ink sans" font-size="15" font-weight="600">262k profile with MTP</text>
  <text x="288" y="211" text-anchor="end" class="muted sans" font-size="13">MTP draft window, 8k</text>
  <path class="base" d="M300 172 h374 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-374 z"/>
  <text x="686" y="190" class="ink sans" font-size="14">41–43</text>
  <path class="ours" d="M300 200 h514 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-514 z"/>
  <text x="826" y="218" class="ink sans" font-size="14" font-weight="600">57–58</text>
  <text x="40" y="272" class="muted sans" font-size="13">RX 7800 XT 16 GB, ROCm 10.1, Tiel 35B MoE. Same build, one part switched on and off. First pair: 2 runs on a busy machine;</text>
  <text x="40" y="290" class="muted sans" font-size="13">second pair: K/V q4_0, -ncmoe 18, -ub 512. Ranges are the runs' minimum and maximum.</text>
</svg>
