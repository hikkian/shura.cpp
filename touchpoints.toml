file = "ggml/src/ggml-cuda/ggml-cuda.cu"
probe = '"ggml_backend_set_abort_callback"'
note = "proc address; llama_context::set_abort_callback already passes the callback to every backend that has it"

[[hook]]
feature = "governor"
file = "tests/CMakeLists.txt"
probe = "test-vram-abort.cpp"
note = "built, not run by ctest: needs a model (test-llama-archs -a llama -o DIR)"

# ---- step 4: expert cache live resize (design §3.3 В, Г, Д, З) ----

[[hook]]
feature = "moe-cache"
file = "src/llama-moe-cache.cpp"
probe = "bool resize(size_t size)"
note = "release banks -> release wait -> allocate (test hook, rollback to the old size, then empty) -> warm fill"

[[hook]]
