# ---- REBASE1 end: the long 262k profile with MTP ----

[[hook]]
feature = "mtp-window"
file = "common/speculative.cpp"
probe = "SHURA_MTP_WINDOW"
note = "the MTP draft attends to the last N positions: trim_window() before each draft decode (process() and draft()), the draft context created for N + a batch"

[[hook]]
feature = "wmma-null-rows"
file = "ggml/src/ggml-cuda/fattn-mma-f16.cuh"
probe = "if (!use_sparse && KV_rows_ptr == nullptr) {"
note = "flash_attn_ext_f16 calls process_tile with a literal nullptr when there are no KV rows (three call sites); upstream's run-time pointer cost ~24 % of the D=256 prefill attention at 100k on gfx1101"
