# Hook points of shura.cpp 1.0 in upstream llama.cpp v1.0.0 files (see docs/SHURA.md). After an update, `scripts/shura-touchpoints.py`
# checks that every `probe` string is still present in its file; a missing one means upstream moved the code and the hook has to be
# re-placed. feature = which part of the fork depends on it. Each REBASE1 step adds its own hooks here.

# ---- step 1: small parts ----

[[hook]]
feature = "abort-backtrace"
file = "common/common.cpp"
probe = "common_install_abort_backtrace"

[[hook]]
feature = "abort-backtrace"
file = "tools/server/server.cpp"
probe = "common_install_abort_backtrace(); // SHURA (HEAPBUG1)"
note = "inside server_install_signal_handlers()"

[[hook]]
feature = "op-failure-diagnostic"
file = "ggml/src/ggml-cuda/ggml-cuda.cu"
probe = "PFAULT1 op=%s"
note = "after cudaGetLastError() in ggml_cuda_compute_forward"

[[hook]]
feature = "slot-save-checkpoints-noop"
file = "common/arg.cpp"
probe = '{"--slot-save-checkpoints"}'

[[hook]]
feature = "pinned-limit"
file = "ggml/src/ggml-cuda/ggml-cuda.cu"
probe = "g_host_pinned_max_bytes"
note = "ggml_backend_cuda_host_buffer_type_alloc_buffer: over the limit after the pools were frozen -> pageable fallback"

[[hook]]
feature = "pinned-limit"
file = "ggml/src/ggml-cuda/ggml-cuda.cu"
probe = '"ggml_backend_cuda_host_set_limit"'
note = "ggml_backend_cuda_reg_get_proc_address; also host_stats, pool_freeze, pool_stats"

[[hook]]
feature = "pinned-limit"
file = "common/arg.cpp"
probe = '{"--host-pinned-max-mib"}'

[[hook]]
feature = "pinned-limit"
file = "tools/server/server.cpp"
probe = "params.host_pinned_max_mib > 0"
note = "after load_model: set the limit and freeze the pools (until the VRAM governor does it after its own warm-up)"

[[hook]]
feature = "pool-accounting"
file = "ggml/src/ggml-cuda/ggml-cuda.cu"
probe = "ggml_cuda_pool_note_growth(\"legacy\""
note = "ggml_cuda_pool_leg::alloc; the vmm pool has the same call"

[[hook]]
feature = "alloc-log"
file = "ggml/src/ggml-cuda/ggml-cuda.cu"
probe = "GGML_CUDA_LOG_ALLOCS"

# ---- step 2: expert cache, the part without threads (design §3.3 A, B, E, Ж) ----

[[hook]]
feature = "moe-cache"
file = "src/llama-moe-cache.cpp"
probe = "void resize_slots(int32_t n)"
note = "moe_cache_lru: slots rebuilt, CRF/last use/clocks kept; init() calls it"

[[hook]]
feature = "moe-cache"
file = "src/llama-moe-cache.cpp"
probe = "std::vector<int32_t> layout(size_t size, bool quiet = false) const"
note = "the slot computation of upstream's constructor, as a function; device split fixed at creation"

[[hook]]
feature = "moe-cache"
file = "src/llama-moe-cache.cpp"
probe = "void apply_layout(const std::vector<int32_t> & n_slots)"
note = "banks, views, bindings and the snapshot; host slot maps exist for all candidate groups"

[[hook]]
feature = "moe-cache"
file = "src/llama-moe-cache.h"
probe = "bool resizable = false"
note = "constructor argument; empty state instead of the 'too small' exception"

[[hook]]
feature = "moe-cache"
file = "src/llama-context.cpp"
probe = "cparams.moe_cache_size > 0 || (cparams.moe_cache_resizable && model.hparams.n_expert > 0)"

[[hook]]
feature = "moe-cache"
file = "src/llama-context.cpp"
probe = "ret[buft].moe_cache += size"
note = "memory breakdown: the cache is a part of `context`, also reported on its own"

[[hook]]
feature = "moe-cache"
file = "src/llama-ext.h"
probe = "size_t moe_cache = 0;"

[[hook]]
feature = "moe-cache"
file = "include/llama.h"
probe = "llama_moe_cache_get_info"
note = "also llama_moe_cache_set_cpu_share; moe_cache_resizable in llama_context_params"

[[hook]]
feature = "moe-cache"
file = "common/arg.cpp"
probe = '{"--moe-cache-live-resize"}'

# ---- step 3: CUDA/HIP hooks for the governor (abort check; the pool freeze/stats and allocation log came in step 1) ----

[[hook]]
feature = "governor"
file = "ggml/src/ggml-cuda/common.cuh"
