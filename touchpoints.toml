[[hook]]
feature = "moe-cache"
file = "src/llama-context.cpp"
probe = "moe_reserve_after_resize()"
note = "process_ubatch: micro-batch lock with yield to a waiting resize, lazy reserve with rollback"

[[hook]]
feature = "moe-cache"
file = "src/llama-context.cpp"
probe = "moe_gen_reserved = moe_gen;"
note = "end of sched_reserve; sched_reserve takes the micro-batch lock (recursive)"

[[hook]]
feature = "moe-cache"
file = "include/llama.h"
probe = "llama_moe_cache_resize"
note = "also resize_pending, set_release_wait, invalidate, test_fail_allocs, self_check"

[[hook]]
feature = "moe-cache"
file = "tests/CMakeLists.txt"
probe = "test-moe-cache-resize.cpp"
note = "built, not run by ctest: needs a GPU and a small MoE model (test-llama-archs -a qwen35moe -o DIR)"

