note = "flash_attn_ext_vec gets ncols2 (GQA-packed columns); the dispatch in ggml_cuda_flash_attn_ext_vec_case for K and V q8_0, q4_0 or q5_0, head 256, GQA 4 or 8, <= 3 tokens (the MTP verify batch); opt-in by the env"

