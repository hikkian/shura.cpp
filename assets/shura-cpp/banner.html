<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{
    --paper:#EEF4F3; --ink:#082A31; --teal:#0F4A55; --teal2:#1A6A78; --mint:#7DE3CB; --amber:#E4B54A; --text:#1E363B; --muted:#4E6B70;
  }
  html[data-theme=dark]{ --paper:#082A31; --text:#E6F1EF; --muted:#9FBBBF; --teal:#CFEAE5; --teal2:#3C8C99; }
  body{margin:0;background:var(--paper);font-family:"Montserrat";color:var(--text);-webkit-font-smoothing:antialiased}
  .banner{width:1200px;height:var(--h,320px);box-sizing:border-box;position:relative;overflow:hidden;background:var(--paper)}
  .row{display:flex;align-items:center;gap:40px;height:100%;padding:0 56px;box-sizing:border-box}
  .word{font-weight:600;font-size:124px;letter-spacing:-0.025em;line-height:1;color:var(--teal);display:flex;align-items:baseline}
  .cpp{font-family:"Source Code Pro";font-weight:500;font-size:104px;color:var(--amber);letter-spacing:-0.04em;margin-left:-14px}
  .tag{font-weight:500;font-size:23px;color:var(--muted);margin-top:16px;letter-spacing:0;line-height:1.35;max-width:720px}
  .ar{font-family:"Droid Arabic Kufi";font-size:26px;color:var(--muted);margin-left:22px;position:relative;top:-4px;direction:rtl;unicode-bidi:isolate}
  svg .stroke{stroke:var(--teal2)}
  /* variant 2: memory bar */
  .bar{display:flex;gap:4px;align-items:stretch;height:26px;margin-top:22px;width:900px}
  .seg{border-radius:4px}
  .legend{display:flex;gap:28px;margin-top:10px;font-size:17px;color:var(--muted);font-weight:500}
  .legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
  /* variant 3 */
  .v3 .word{font-size:152px}
  .v3 .cpp{font-size:128px;position:relative}
  .dotstar{position:relative;display:inline-block;width:0.34em;height:0.34em;vertical-align:0.02em;margin:0 0.06em 0 0.12em}
</style></head>
<body>
<div id="root"></div>
<script>
const q=new URLSearchParams(location.search); const v=q.get('v')||'1'; const theme=q.get('theme')||'light';
document.documentElement.dataset.theme=theme;
const dark=theme==='dark';
const star=(size,opts={})=>{
  // eight-point star tile: two squares, eight nodes, center; hot nodes solid mint, cold nodes amber outline
  const hot=[0,1,3,4,6], cold=[2,5,7];
  const nodes=[...Array(8)].map((_,i)=>{const a=i*Math.PI/4-Math.PI/2;const r=58;return [100+r*Math.cos(a),100+r*Math.sin(a)]});
  const tile=dark?'#0F4A55':'#0F4A55';
  const rays=nodes.map(([x,y])=>`<line x1="100" y1="100" x2="${x}" y2="${y}" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/>`).join('');
  const dots=nodes.map(([x,y],i)=>hot.includes(i)?`<circle cx="${x}" cy="${y}" r="11.5" fill="var(--mint)"/>`:`<circle cx="${x}" cy="${y}" r="11" fill="${tile}" stroke="var(--amber)" stroke-width="3"/>`).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="8" y="8" width="184" height="184" rx="34" fill="${tile}"/>
    <rect x="38" y="38" width="124" height="124" rx="8" fill="none" stroke="#2E8A92" stroke-width="5"/>
    <rect x="38" y="38" width="124" height="124" rx="8" fill="none" stroke="#2E8A92" stroke-width="5" transform="rotate(45 100 100)"/>
    ${rays}${dots}<circle cx="100" cy="100" r="17" fill="var(--amber)"/></svg>`;
};
const word=(extra='')=>`<div class="word">shura<span class="cpp">.cpp</span>${extra}</div>`;
const tagline='The inference engine of Shura: a fork of llama.cpp that shares one gaming GPU with the desktop you keep using.';
let html='';
if(v==='1'){
  html=`<div class="banner"><div class="row">${star(216)}<div>${word('<span class="ar">شورى</span>')}<div class="tag">${tagline}</div></div></div></div>`;
}else if(v==='2'){
  const segs=[['var(--teal2)',300,'weights on the GPU'],['#2E8A92',120,'KV cache'],...[72,60,50,42,34,26,18,12,8].map(w=>['var(--mint)',w,null]),['transparent',150,'1.5 GiB kept for the desktop']];
  const bar=segs.map(([c,w,l])=>`<div class="seg" style="width:${w}px;background:${c};${c==='transparent'?'border:2px dashed var(--amber);box-sizing:border-box':''}"></div>`).join('');
  const legend=`<div class="legend"><span style="--c:var(--teal2)">weights</span><span>KV cache</span><span>expert cache, elastic</span><span>1.5 GiB kept for the desktop</span></div>`;
  html=`<div class="banner" style="--h:360px"><div class="row" style="align-items:flex-start;padding-top:44px"><div>${word()}<div class="bar">${bar}</div>
  <div class="legend">
   <span style="display:flex;align-items:center;gap:8px"><i style="width:14px;height:14px;border-radius:3px;background:var(--teal2)"></i>weights</span>
   <span style="display:flex;align-items:center;gap:8px"><i style="width:14px;height:14px;border-radius:3px;background:#2E8A92"></i>KV cache</span>
   <span style="display:flex;align-items:center;gap:8px"><i style="width:14px;height:14px;border-radius:3px;background:var(--mint)"></i>expert cache, elastic</span>
   <span style="display:flex;align-items:center;gap:8px"><i style="width:14px;height:14px;border-radius:3px;border:2px dashed var(--amber);box-sizing:border-box"></i>1.5 GiB kept for the desktop</span>
  </div><div class="tag" style="margin-top:20px;max-width:1000px">A fork of llama.cpp. The engine under Shura, built to give the card back the moment the desktop needs it.</div></div></div></div>`;
}else{
  const dotstar=`<span class="dotstar"><svg viewBox="0 0 100 100" width="100%" height="100%" style="position:absolute;inset:0;overflow:visible">
   ${[...Array(8)].map((_,i)=>{const a=i*Math.PI/4;const x1=50+30*Math.cos(a),y1=50+30*Math.sin(a),x2=50+48*Math.cos(a),y2=50+48*Math.sin(a);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--amber)" stroke-width="11" stroke-linecap="round"/>`}).join('')}
   <circle cx="50" cy="50" r="20" fill="var(--amber)"/></svg></span>`;
  html=`<div class="banner v3"><div class="row"><div><div class="word">shura<span class="cpp">${dotstar}cpp</span></div><div class="tag" style="font-size:25px;max-width:900px">${tagline}</div></div></div></div>`;
}
document.getElementById('root').innerHTML=html;
</script></body></html>
